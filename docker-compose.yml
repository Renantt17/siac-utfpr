services:
  db:
    image: postgres:16-bookworm
    container_name: siac-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-siac}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-siac}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - siac_net

  backend:
    build:
      context: ./backend
    container_name: siac-backend
    env_file:
      - .env
    environment:
      DB_NAME: ${DB_NAME:-${POSTGRES_DB:-siac}}
      DB_USER: ${DB_USER:-siac_app}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      DB_HOST: db
      DB_PORT: 5432
      USE_X_ACCEL_REDIRECT: ${USE_X_ACCEL_REDIRECT:-True}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - media_data:/app/media
      - ./db:/db:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - siac_net

  nginx:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    container_name: siac-nginx
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/var/www/media:ro
    depends_on:
      - backend
    networks:
      - siac_net

volumes:
  pgdata:
  media_data:

networks:
  siac_net:
    driver: bridge
