
services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DB_NAME: ${DB_NAME:-${POSTGRES_DB:-siac}}
      DB_USER: ${DB_USER:-${POSTGRES_USER:-siac}}
      DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-siac_dev_password}}
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-siac}
      POSTGRES_USER: ${POSTGRES_USER:-siac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-siac_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-siac} -d ${POSTGRES_DB:-siac}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
