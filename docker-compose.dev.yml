# Override opcional para desenvolvimento local com hot-reload (Vite :5173 + runserver)
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  backend:
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DEBUG: "True"
      USE_X_ACCEL_REDIRECT: "False"
    volumes:
      - ./backend:/app
      - media_data:/app/media

  frontend-dev:
    image: node:22-alpine
    container_name: siac-frontend-dev
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-8000}/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    networks:
      - siac_net

volumes:
  frontend_node_modules:
